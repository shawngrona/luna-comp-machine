<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="photo"><rect x="0" y="0" width="512" height="300"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0e0e0e"/>
    <!-- blue duotone "photo": a keyboard in steep perspective -->
    <g clip-path="url(#photo)">
      <rect width="512" height="300" fill="#1f5fbf"/>
      <g transform="translate(-60 -40) rotate(-18) skewX(-14)">
        <g fill="#8fb6f0" stroke="#1f5fbf" stroke-width="6">
          <rect x="0" y="40" width="70" height="330"/><rect x="70" y="40" width="70" height="330"/><rect x="140" y="40" width="70" height="330"/>
          <rect x="210" y="40" width="70" height="330"/><rect x="280" y="40" width="70" height="330"/><rect x="350" y="40" width="70" height="330"/>
          <rect x="420" y="40" width="70" height="330"/><rect x="490" y="40" width="70" height="330"/><rect x="560" y="40" width="70" height="330"/>
        </g>
        <g fill="#0b1f45">
          <rect x="48" y="40" width="44" height="200"/><rect x="118" y="40" width="44" height="200"/>
          <rect x="258" y="40" width="44" height="200"/><rect x="328" y="40" width="44" height="200"/><rect x="398" y="40" width="44" height="200"/>
          <rect x="538" y="40" width="44" height="200"/>
        </g>
      </g>
      <rect width="512" height="300" fill="#0e0e0e" opacity="0.18"/>
    </g>
    <rect x="0" y="300" width="512" height="14" fill="#f2c230"/>
    <text x="22" y="508" font-family="Helvetica Neue, Helvetica, Arial" font-weight="900" font-size="212" letter-spacing="-12" fill="#f4f1ea" textLength="470" lengthAdjust="spacingAndGlyphs">comp</text>
    <text x="492" y="348" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700" font-size="30" letter-spacing="8" fill="#f2c230">MACHINE</text>
  </g>
</svg>
